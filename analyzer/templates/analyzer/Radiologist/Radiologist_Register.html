<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radiologist Registration | MedAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .reg-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; }
        .btn-primary { background: #3b82f6; border: none; padding: 12px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="reg-card">
        <h3 class="fw-bold text-center mb-4">Radiologist Join</h3>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger small">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold">Full Name / Username</label>
                <input type="text" name="username" class="form-control bg-light border-0" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Medical Email</label>
                <input type="email" name="email" class="form-control bg-light border-0" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" name="password" class="form-control bg-light border-0" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Register as Radiologist</button>
        </form>
        <p class="text-center mt-3 small">Already have access? <a href="{% url 'login' %}">Login</a></p>
    </div>
</body>
</html>
